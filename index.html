<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍇 문희사항 🍇</title>
  <!-- Supabase JS SDK 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #fff9fb;
      --card-bg: #ffffff;
      --text-color: #4a4a4a;
      --pink-main: #ffb6c1;
      --pink-soft: #fff0f5;
      --pink-dark: #ff8da1;
      --border-color: #ffe4e1;
      --bad-color: #a1b5cc;
      --bad-soft: #f0f3f7;
      --bad-border: #d4dce6;
      --border-radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 12px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 4px; }
    header h1 { font-size: 1.5rem; color: #ff6b81; font-weight: 800; }
    .top-btns { display: flex; gap: 6px; }
    .top-btn { background: #fff; border: 1px solid var(--border-color); padding: 7px 12px; border-radius: 18px; font-size: 0.8rem; font-weight: 600; color: #666; cursor: pointer; box-shadow: 0 2px 8px rgba(255,182,193,0.15); }
    
    /* 로그인 오버레이 화면 */
    .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,249,251,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: white; padding: 30px 24px; border-radius: 28px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(255,182,193,0.2); border: 1px solid var(--border-color); text-align: center; }
    .auth-card h2 { color: #ff6b81; font-size: 1.4rem; margin-bottom: 8px; }
    .auth-card p { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
    .auth-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 14px; margin-bottom: 12px; font-size: 0.9rem; outline: none; }
    .auth-input:focus { border-color: var(--pink-main); }
    .auth-btn { width: 100%; padding: 12px; background: var(--pink-main); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-bottom: 8px; }
    .auth-switch { font-size: 0.8rem; color: #666; cursor: pointer; margin-top: 10px; display: inline-block; }

    .dual-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .user-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(255,182,193,0.1); }
    .user-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--pink-soft); }
    .user-name { font-size: 1.15rem; font-weight: 700; color: #333; }
    .board-toggle { display: flex; background: var(--pink-soft); border-radius: 16px; padding: 3px; margin-bottom: 14px; }
    .board-toggle.bad-mode { background: var(--bad-soft); }
    .board-toggle button { flex: 1; border: none; background: transparent; padding: 7px; border-radius: 13px; font-size: 0.85rem; font-weight: 600; color: #888; cursor: pointer; }
    .board-toggle button.active.like { background: white; color: var(--pink-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .board-toggle button.active.bad { background: white; color: #5b7bb2; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .board-status { display: flex; justify-content: space-between; font-size: 0.85rem; color: #888; margin-bottom: 16px; padding: 0 4px; }
    .grape-container { background: var(--pink-soft); border-radius: 20px; padding: 22px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .grape-container.bad-mode { background: var(--bad-soft); }
    .grape-row { display: flex; gap: 8px; }
    .grape-grape { width: 46px; height: 46px; border-radius: 50%; background: #ffffff; border: 1.5px dashed #ffd1dc; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; color: #bbb; cursor: pointer; position: relative; overflow: hidden; }
    .grape-container.bad-mode .grape-grape { border: 1.5px dashed var(--bad-border); }
    .grape-grape svg { width: 82%; height: 82%; display: block; }
    .grape-grape.full.like { background: var(--pink-main); border: none; box-shadow: 0 4px 10px rgba(255,182,193,0.5); }
    .grape-grape.full.bad { background: var(--bad-color); border: none; box-shadow: 0 4px 10px rgba(161,181,204,0.4); }
    .memo-section { margin-top: 16px; background: #faf8f9; border-radius: 14px; padding: 12px 14px; border: 1px dashed #e6d2d7; }
    .memo-section.bad-mode { background: #f4f6f9; border-color: #cbd5e1; }
    .memo-line { font-size: 0.85rem; font-weight: 600; color: #444; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
    .memo-textarea { width: 100%; height: 50px; padding: 8px; border: 1px solid #ccc; border-radius: 10px; font-size: 0.85rem; resize: none; outline: none; margin-bottom: 6px; }
    .memo-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .memo-btns button { padding: 4px 10px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .memo-edit-btn { background: #e2e8f0; color: #475569; }
    .memo-save-btn { background: var(--pink-main); color: white; }
    .memo-del-btn { background: #ff6b81; color: white; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: white; border-radius: 24px; padding: 22px; width: 90%; max-width: 380px; max-height: 80vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid var(--pink-soft); }
    .modal-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal h3 { font-size: 1.05rem; color: #333; }
    .small-edit-btn { background: #f0f0f0; border: none; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; color: #555; cursor: pointer; }
    .terms-list { list-style: none; padding: 0; margin: 10px 0 16px 0; }
    .terms-list li { font-size: 0.85rem; line-height: 1.5; color: #555; margin-bottom: 8px; padding-left: 18px; position: relative; }
    .terms-list li::before { content: '✔'; position: absolute; left: 0; color: var(--pink-dark); font-weight: bold; font-size: 0.75rem; }
    .terms-textarea { width: 100%; height: 180px; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.85rem; line-height: 1.5; resize: vertical; outline: none; margin-bottom: 12px; }
    .modal-options { display: flex; gap: 8px; margin-bottom: 12px; }
    .modal-options button { flex: 1; padding: 9px; border: 1px solid var(--border-color); border-radius: 12px; background: white; color: #666; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .modal-options button.selected { border-color: var(--pink-main); background: var(--pink-soft); color: var(--pink-dark); }
    .modal textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; resize: none; margin-bottom: 14px; font-size: 0.85rem; outline: none; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .modal-btns .cancel { background: #f0f0f0; color: #666; }
    .modal-btns .save { background: var(--pink-main); color: white; }
    .modal-btns .delete-btn { background: #ff6b81; color: white; }
    .modal-btns .edit-btn { background: #4a90e2; color: white; }
    .archive-card { background: var(--pink-soft); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .archive-card-header { font-weight: 700; margin-bottom: 6px; color: #4a4a4a; display: flex; justify-content: space-between; font-size: 0.8rem; }
  </style>
</head>
<body>

<!-- 로그인 / 회원가입 화면 -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 id="authTitle">🍇 문희사항 로그인 🍇</h2>
    <p id="authDesc">두 분만의 소중한 공간에 오신 걸 환영해요!</p>
    <input type="email" id="authEmail" class="auth-input" placeholder="이메일 주소 입력">
    <input type="password" id="authPassword" class="auth-input" placeholder="비밀번호 (6자리 이상)">
    <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">로그인하기</button>
    <span class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">계정이 없으신가요? 회원가입하기</span>
  </div>
</div>

<div class="container">
  <header>
    <h1>🍇 문희사항 🍇</h1>
    <div class="top-btns">
      <button class="top-btn" onclick="openTermsModal()">📋 이용약관</button>
      <button class="top-btn" onclick="openArchiveModal()">📜 보관함</button>
      <button class="top-btn" onclick="handleLogout()" style="color:#ff6b81;">로그아웃</button>
    </div>
  </header>

  <div class="dual-board">
    <!-- 사용자 1 카드 -->
    <div class="user-card" id="card-user1">
      <div class="user-card-header">
        <span class="user-name">사용자 1 (세희)</span>
        <span id="badge-user1" style="font-size:0.75rem; background:#fff0f5; color:#ff8da1; padding:2px 8px; border-radius:10px; font-weight:600;"></span>
      </div>
      <div class="board-toggle" id="toggle-user1">
        <button class="active like" onclick="switchBoard('user1', 'like')">좋아요</button>
        <button class="bad" onclick="switchBoard('user1', 'bad')">나빠요</button>
      </div>
      <div class="board-status">
        <span id="vol-user1">Vol. 1</span>
        <span id="count-user1">0 / 15개</span>
      </div>
      <div class="grape-container" id="grape-user1"></div>
      <div class="memo-section" id="memoSection-user1"></div>
    </div>

    <!-- 사용자 2 카드 -->
    <div class="user-card" id="card-user2">
      <div class="user-card-header">
        <span class="user-name">사용자 2 (재민)</span>
        <span id="badge-user2" style="font-size:0.75rem; background:#fff0f5; color:#ff8da1; padding:2px 8px; border-radius:10px; font-weight:600;"></span>
      </div>
      <div class="board-toggle" id="toggle-user2">
        <button class="active like" onclick="switchBoard('user2', 'like')">좋아요</button>
        <button class="bad" onclick="switchBoard('user2', 'bad')">나빠요</button>
      </div>
      <div class="board-status">
        <span id="vol-user2">Vol. 1</span>
        <span id="count-user2">0 / 15개</span>
      </div>
      <div class="grape-container" id="grape-user2"></div>
      <div class="memo-section" id="memoSection-user2"></div>
    </div>
  </div>
</div>

<!-- 각종 모달창들 -->
<div class="modal-overlay" id="termsModal">
  <div class="modal">
    <div class="modal-header-flex">
      <h3 id="termsModalTitle">📋 우리 둘만의 이용 약관</h3>
      <button class="small-edit-btn" id="termsTopEditBtn" onclick="openTermsEdit()">수정</button>
    </div>
    <div id="termsBody"></div>
    <div class="modal-btns" id="termsModalBtns"></div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="modalTitle">스티커 선물하기</h3>
    <div class="modal-options">
      <button class="selected" id="val-1" onclick="selectValue(1)">1개</button>
      <button id="val-05" onclick="selectValue(0.5)">0.5개</button>
    </div>
    <textarea id="stickerReason" placeholder="스티커를 주는 이유를 적어주세요!"></textarea>
    <div class="modal-btns">
      <button class="cancel" onclick="closeAddModal()">취소</button>
      <button class="save" onclick="submitSticker()">스티커 붙이기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h3 id="detailTitle">🍇 스티커 정보</h3>
    <div id="detailContentBody" style="margin-bottom:15px; line-height: 1.5; color:#555; font-size: 0.88rem;"></div>
    <div class="modal-btns" id="detailModalBtns">
      <button class="cancel" onclick="closeDetailModal()">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="archiveModal">
  <div class="modal">
    <h3>📜 완성된 포도판 보관함</h3>
    <div class="modal-options" style="margin: 10px 0;">
      <button id="filter-user1" class="selected" onclick="filterArchive('user1')">사용자 1</button>
      <button id="filter-user2" onclick="filterArchive('user2')">사용자 2</button>
    </div>
    <div id="archiveList"></div>
    <div class="modal-btns" style="margin-top: 12px;">
      <button class="cancel" onclick="closeArchiveModal()">닫기</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://skxaatryqofhfluakczz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_5q751-dGVaSXEW6YEJqZ2w_wOGghSQU';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserId = null;
  let isSignUpMode = false;

  const smileSvg = `<svg viewBox="0 0 100 100"><ellipse cx="36" cy="38" rx="5.5" ry="11" fill="#333" /><ellipse cx="64" cy="38" rx="5.5" ry="11" fill="#333" /><path d="M 28 58 Q 50 82 72 58" fill="none" stroke="#333" stroke-width="6.5" stroke-linecap="round" /></svg>`;
  const sadSvg = `<svg viewBox="0 0 100 100"><ellipse cx="36" cy="38" rx="5.5" ry="11" fill="#333" /><ellipse cx="64" cy="38" rx="5.5" ry="11" fill="#333" /><path d="M 28 72 Q 50 52 72 72" fill="none" stroke="#333" stroke-width="6.5" stroke-linecap="round" /></svg>`;

  const defaultTerms = [
    "하루에 스티커는 최대 3개까지만 줄 수 있어요.",
    "한 가지 일에는 최대 1개 스티커만 줄 수 있어요.",
    "바라는 것의 금전적인 한도는 최대 3만 원이에요.",
    "좋아요 완성 판 5개 모으면 한 달간 당신이 왕이에요!",
    "안 준 스티커는 내일로 이월되지 않아요.",
    "사유를 잘못 적었을 땐 상대방 화면에서 언제든 수정/삭제가 가능해요."
  ];

  let appState = {
    terms: [...defaultTerms],
    users: { user1: { activeTab: 'like', ownerEmail: '' }, user2: { activeTab: 'like', ownerEmail: '' } },
    boards: {
      user1: { like: { currentVol: 1, stickers: [], memo: '' }, bad: { currentVol: 1, stickers: [], memo: '' }, archive: [] },
      user2: { like: { currentVol: 1, stickers: [], memo: '' }, bad: { currentVol: 1, stickers: [], memo: '' }, archive: [] }
    }
  };

  let selectedTargetUser = null, selectedVal = 1, currentActiveItem = null, currentActiveTargetUser = null, currentActiveTab = null;

  window.onload = async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      document.getElementById('authOverlay').style.display = 'none';
      await loadCloudData();
    }
  };

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').innerText = isSignUpMode ? '🍇 문희사항 회원가입 🍇' : '🍇 문희사항 로그인 🍇';
    document.getElementById('authSubmitBtn').innerText = isSignUpMode ? '가입하고 시작하기' : '로그인하기';
    document.getElementById('authSwitchText').innerText = isSignUpMode ? '이미 계정이 있으신가요? 로그인하기' : '계정이 없으신가요? 회원가입하기';
  }

  async function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    if (!email || !password) { alert('이메일과 비밀번호를 입력해주세요!'); return; }

    if (isSignUpMode) {
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) { alert('가입 실패: ' + error.message); return; }
      alert('회원가입 완료! 로그인되었습니다.');
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { alert('로그인 실패: ' + error.message); return; }
    }

    document.getElementById('authOverlay').style.display = 'none';
    await loadCloudData();
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  async function loadCloudData() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    const email = user.email;

    const { data } = await supabaseClient.from('boards_data').select('*');
    if (data && data.length > 0) {
      const savedState = data.find(row => row.id === 'main_state');
      if (savedState && savedState.data) {
        appState = savedState.data;
      }
    }

    if (appState.users.user1.ownerEmail === email) currentUserId = 'user1';
    else if (appState.users.user2.ownerEmail === email) currentUserId = 'user2';
    else {
      if (!appState.users.user1.ownerEmail) { appState.users.user1.ownerEmail = email; currentUserId = 'user1'; }
      else if (!appState.users.user2.ownerEmail) { appState.users.user2.ownerEmail = email; currentUserId = 'user2'; }
      else { currentUserId = 'user1'; }
      await saveCloudData();
    }

    renderAll();
  }

  async function saveCloudData() {
    await supabaseClient.from('boards_data').upsert({
      id: 'main_state',
      data: appState,
      updated_at: new Date()
    });
  }

  function renderAll() {
    renderBoard('user1');
    renderBoard('user2');
  }

  function renderBoard(userId) {
    const tab = appState.users[userId].activeTab;
    const board = appState.boards[userId][tab];
    const container = document.getElementById(`grape-${userId}`);
    const toggle = document.getElementById(`toggle-${userId}`);
    const memoSection = document.getElementById(`memoSection-${userId}`);
    const badge = document.getElementById(`badge-${userId}`);
    
    badge.innerText = userId === currentUserId ? '내 계정 💖' : '상대방';

    if (tab === 'bad') {
      container.classList.add('bad-mode'); toggle.classList.add('bad-mode'); memoSection.classList.add('bad-mode');
    } else {
      container.classList.remove('bad-mode'); toggle.classList.remove('bad-mode'); memoSection.classList.remove('bad-mode');
    }

    const card = document.getElementById(`card-${userId}`);
    const btns = card.querySelectorAll('.board-toggle button');
    btns[0].className = tab === 'like' ? 'active like' : '';
    btns[1].className = tab === 'bad' ? 'active bad' : '';

    let totalCount = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
    document.getElementById(`vol-${userId}`).innerText = `${tab === 'like' ? '좋아요' : '나빠요'} Vol. ${board.currentVol}`;
    document.getElementById(`count-${userId}`).innerText = `${totalCount} / 15개`;
    
    container.innerHTML = '';
    const layout = [5, 4, 3, 2, 1];
    let stickerIdx = 0;
    
    layout.forEach(rowCount => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'grape-row';
      for (let i = 0; i < rowCount; i++) {
        const grapeIndex = stickerIdx;
        const grape = document.createElement('div');
        grape.className = 'grape-grape';
        
        let accumulated = 0, filledType = null, itemData = null;
        for (let item of board.stickers) {
          accumulated += item.value;
          if (accumulated - item.value < grapeIndex + 1 && accumulated > grapeIndex) {
            itemData = item;
            filledType = accumulated >= grapeIndex + 1 ? 'full' : 'half';
          }
        }

        if (filledType) {
          grape.classList.add(filledType, tab);
          grape.innerHTML = tab === 'like' ? smileSvg : sadSvg;
          grape.onclick = () => showStickerDetail(userId, itemData, tab);
        } else {
          grape.innerText = grapeIndex + 1;
          grape.onclick = () => handleGrapeClick(userId, grapeIndex);
        }
        rowDiv.appendChild(grape);
        stickerIdx++;
      }
      container.appendChild(rowDiv);
    });

    renderMemo(userId, tab, memoSection);
  }

  function renderMemo(userId, tab, memoSection) {
    const board = appState.boards[userId][tab];
    const isMyLikeBoard = (tab === 'like' && userId === currentUserId);
    const isOtherBadBoard = (tab === 'bad' && userId !== currentUserId);
    const canEdit = isMyLikeBoard || isOtherBadBoard;
    const icon = tab === 'like' ? '✨' : '🔥';

    memoSection.innerHTML = `<div class="memo-line"><span id="memoTextDisplay-${userId}"></span><div id="memoActionBtns-${userId}"></div></div>`;
    const displaySpan = document.getElementById(`memoTextDisplay-${userId}`);
    const actionBtns = document.getElementById(`memoActionBtns-${userId}`);

    if (board.memo) {
      displaySpan.innerText = `다 모으면: ${icon}${board.memo}${icon}`;
      if (canEdit) {
        actionBtns.innerHTML = `<div class="memo-btns" style="margin-left: 8px;"><button class="memo-edit-btn" onclick="editMemo('${userId}', '${tab}')">수정</button><button class="memo-del-btn" onclick="deleteMemo('${userId}', '${tab}')">삭제</button></div>`;
      }
    } else {
      if (canEdit) {
        displaySpan.innerHTML = `<span style="color:#aaa; cursor:pointer; font-weight:normal;" onclick="editMemo('${userId}', '${tab}')">당신이 바라는 것은?</span>`;
      } else {
        displaySpan.innerHTML = `<span style="color:#aaa; font-weight:normal;">등록된 내용이 없습니다.</span>`;
      }
    }
  }

  function editMemo(userId, tab) {
    const board = appState.boards[userId][tab];
    document.getElementById(`memoSection-${userId}`).innerHTML = `
      <textarea class="memo-textarea" id="memoInput-${userId}" placeholder="내용을 입력하세요">${board.memo || ''}</textarea>
      <div class="memo-btns"><button class="memo-edit-btn" onclick="renderBoard('${userId}')">취소</button><button class="memo-save-btn" onclick="saveMemo('${userId}', '${tab}')">저장</button></div>
    `;
  }

  async function saveMemo(userId, tab) {
    appState.boards[userId][tab].memo = document.getElementById(`memoInput-${userId}`).value.trim();
    await saveCloudData();
    renderBoard(userId);
  }

  async function deleteMemo(userId, tab) {
    if (!confirm('내용을 삭제하시겠습니까?')) return;
    appState.boards[userId][tab].memo = '';
    await saveCloudData();
    renderBoard(userId);
  }

  function switchBoard(userId, tab) {
    appState.users[userId].activeTab = tab;
    renderBoard(userId);
  }

  function handleGrapeClick(targetUserId, grapeIndex) {
    if (currentUserId === targetUserId) {
      alert('본인의 포도판에는 직접 스티커를 붙일 수 없어요! 상대방 판에만 붙일 수 있습니다.');
      return;
    }
    const tab = appState.users[targetUserId].activeTab;
    const board = appState.boards[targetUserId][tab];
    if (board.stickers.reduce((acc, cur) => acc + cur.value, 0) >= 15) { alert('이미 15개가 완성된 판입니다.'); return; }

    selectedTargetUser = targetUserId;
    selectedVal = 1;
    document.getElementById('modalTitle').innerText = `${tab === 'like' ? '💖 좋아요' : '💔 나빠요'} 스티커 선물`;
    document.getElementById('stickerReason').value = '';
    document.getElementById('addModal').classList.add('active');
  }

  function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
  function selectValue(val) {
    selectedVal = val;
    document.getElementById('val-1').className = val === 1 ? 'selected' : '';
    document.getElementById('val-05').className = val === 0.5 ? 'selected' : '';
  }

  async function submitSticker() {
    const reason = document.getElementById('stickerReason').value.trim();
    if (!reason) { alert('사유를 입력해주세요!'); return; }

    const tab = appState.users[selectedTargetUser].activeTab;
    const board = appState.boards[selectedTargetUser][tab];
    const today = new Date().toISOString().split('T')[0];

    board.stickers.push({ value: selectedVal, reason: reason, date: today, from: currentUserId });

    if (board.stickers.reduce((acc, cur) => acc + cur.value, 0) >= 15) {
      alert('🎉 포도판 완성! 보관함에 이관되었습니다.');
      appState.boards[selectedTargetUser].archive.push({ vol: board.currentVol, type: tab, stickers: [...board.stickers], memo: board.memo, completedDate: today });
      board.currentVol += 1; board.stickers = []; board.memo = '';
    }

    await saveCloudData();
    renderAll();
    closeAddModal();
  }

  function showStickerDetail(targetUserId, item, tab) {
    if (!item) return;
    currentActiveItem = item; currentActiveTargetUser = targetUserId; currentActiveTab = tab;
    document.getElementById('detailTitle').innerText = `${tab === 'like' ? '좋아요' : '나빠요'} 스티커 정보`;
    document.getElementById('detailContentBody').innerHTML = `<b>날짜:</b> ${item.date}<br><b>스티커:</b> ${item.value}개<br><br><b>📝 사유:</b><br>${item.reason}`;
    
    const btnsDiv = document.getElementById('detailModalBtns');
    btnsDiv.innerHTML = item.from === currentUserId ? 
      `<button class="delete-btn" onclick="deleteSticker()">삭제</button><button class="cancel" onclick="closeDetailModal()">닫기</button>` : 
      `<button class="cancel" onclick="closeDetailModal()">닫기</button>`;
    document.getElementById('detailModal').classList.add('active');
  }

  async function deleteSticker() {
    if (!confirm('정말 이 스티커를 삭제하시겠습니까?')) return;
    const board = appState.boards[currentActiveTargetUser][currentActiveTab];
    const idx = board.stickers.indexOf(currentActiveItem);
    if (idx > -1) board.stickers.splice(idx, 1);

    await saveCloudData();
    renderAll();
    closeDetailModal();
  }

  function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }
  function openTermsModal() { document.getElementById('termsModal').classList.add('active'); }
  function closeTermsModal() { document.getElementById('termsModal').classList.remove('active'); }
  function openArchiveModal() { filterArchive('user1'); document.getElementById('archiveModal').classList.add('active'); }
  function closeArchiveModal() { document.getElementById('archiveModal').classList.remove('active'); }

  function filterArchive(userId) {
    document.getElementById('filter-user1').className = userId === 'user1' ? 'selected' : '';
    document.getElementById('filter-user2').className = userId === 'user2' ? 'selected' : '';
    const listDiv = document.getElementById('archiveList');
    const archive = appState.boards[userId].archive;
    if (!archive || archive.length === 0) { listDiv.innerHTML = `<p style="text-align:center; padding:20px; color:#aaa; font-size:0.8rem;">아직 완성된 포도판이 없습니다.</p>`; return; }

    listDiv.innerHTML = '';
    archive.forEach(item => {
      const card = document.createElement('div');
      card.className = 'archive-card';
      card.innerHTML = `<div class="archive-card-header"><span>${item.type === 'like' ? '좋아요' : '나빠요'} Vol. ${item.vol}</span><span>완성일: ${item.completedDate}</span></div><ul style="padding-left:16px;">` + 
        item.stickers.map(s => `<li style="font-size:0.78rem; color:#666;">[${s.date}] ${s.reason} (${s.value}개)</li>`).join('') + `</ul>`;
      listDiv.appendChild(card);
    });
  }
</script>
</body>
</html>
