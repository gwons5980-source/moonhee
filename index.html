<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍇 문희사항 🍇</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #fff9fb;
      --card-bg: #ffffff;
      --text-color: #4a4a4a;
      --pink-main: #ffb6c1;
      --pink-soft: #fff0f5;
      --pink-dark: #ff8da1;
      --border-color: #ffe4e1;
      --bad-color: #a1b5cc;
      --bad-soft: #f0f3f7;
      --bad-border: #d4dce6;
      --border-radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 18px 12px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 18px; padding: 0 4px; gap: 10px; }
    header h1 { font-size: 1.35rem; color: #ff6b81; font-weight: 800; }
    .top-btns { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; justify-content: flex-start; }
    .top-btn { background: #fff; border: 1px solid var(--border-color); padding: 7px 12px; border-radius: 18px; font-size: 0.8rem; font-weight: 600; color: #666; cursor: pointer; box-shadow: 0 2px 8px rgba(255,182,193,0.15); white-space: nowrap; position: relative; }
    
    .badge-dot { position: absolute; top: -3px; right: -3px; background: #ff6b81; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,249,251,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: white; padding: 30px 24px; border-radius: 28px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(255,182,193,0.2); border: 1px solid var(--border-color); text-align: center; }
    .auth-card h2 { color: #ff6b81; font-size: 1.4rem; margin-bottom: 8px; }
    .auth-card p { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
    .auth-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 14px; margin-bottom: 12px; font-size: 0.9rem; outline: none; }
    .auth-input:focus { border-color: var(--pink-main); }
    .auth-btn { width: 100%; padding: 12px; background: var(--pink-main); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-bottom: 8px; }
    .auth-switch { font-size: 0.8rem; color: #666; cursor: pointer; margin-top: 10px; display: inline-block; }

    .dual-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .user-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 18px 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(255,182,193,0.1); }
    .user-card-header { display: flex; justify-content: space-between; align-items: center; }
    .user-name { font-size: 1.15rem; font-weight: 700; color: #333; cursor: pointer; }
    .user-name.editable:hover { color: #ff6b81; text-decoration: underline; text-underline-offset: 4px; }
    
    .header-action-btns { display: flex; gap: 6px; align-items: center; }
    .fold-btn { background: var(--pink-soft); border: none; padding: 5px 11px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; color: var(--pink-dark); cursor: pointer; white-space: nowrap; }
    .sticker-btn { background: var(--pink-main); color: white; border: none; padding: 5px 11px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .poke-btn { background: #fff0f5; border: 1px solid var(--pink-main); padding: 5px 9px; border-radius: 12px; font-size: 0.78rem; cursor: pointer; }

    .card-body-content { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--pink-soft); }
    .card-body-content.folded { display: none; }

    .board-toggle { display: flex; background: var(--pink-soft); border-radius: 16px; padding: 3px; margin-bottom: 14px; }
    .board-toggle.bad-mode { background: var(--bad-soft); }
    .board-toggle button { flex: 1; border: none; background: transparent; padding: 7px; border-radius: 13px; font-size: 0.85rem; font-weight: 600; color: #888; cursor: pointer; }
    .board-toggle button.active.like { background: white; color: var(--pink-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .board-toggle button.active.bad { background: white; color: #5b7bb2; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .board-status { display: flex; justify-content: space-between; font-size: 0.85rem; color: #888; margin-bottom: 16px; padding: 0 4px; }
    .grape-container { background: var(--pink-soft); border-radius: 20px; padding: 22px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .grape-container.bad-mode { background: var(--bad-soft); }
    .grape-row { display: flex; gap: 8px; }
    .grape-grape { width: 46px; height: 46px; border-radius: 50%; background: #ffffff; border: 1.5px dashed #ffd1dc; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; color: #bbb; position: relative; overflow: hidden; cursor: default; }
    .grape-container.bad-mode .grape-grape { border: 1.5px dashed var(--bad-border); }
    .grape-grape.full { cursor: pointer; }
    .grape-grape svg { width: 82%; height: 82%; display: block; }
    
    .grape-grape.full.like { background: var(--pink-main); border: none; box-shadow: 0 4px 10px rgba(255,182,193,0.5); }
    .grape-grape.full.bad { background: var(--bad-color); border: none; box-shadow: 0 4px 10px rgba(161,181,204,0.4); }

    .memo-section { margin-top: 16px; background: #faf8f9; border-radius: 14px; padding: 12px 14px; border: 1px dashed #e6d2d7; }
    .memo-section.bad-mode { background: #f4f6f9; border-color: #cbd5e1; }
    .memo-line { font-size: 0.85rem; font-weight: 600; color: #444; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
    .memo-textarea { width: 100%; height: 50px; padding: 8px; border: 1px solid #ccc; border-radius: 10px; font-size: 0.85rem; resize: none; outline: none; margin-bottom: 6px; }
    .memo-btns { display: flex; gap: 6px; justify-content: flex-end; flex-shrink: 0; }
    .memo-btns button { padding: 4px 10px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .memo-edit-btn { background: #e2e8f0; color: #475569; }
    .memo-save-btn { background: var(--pink-main); color: white; }
    .memo-del-btn { background: #ff6b81; color: white; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: white; border-radius: 24px; padding: 22px; width: 90%; max-width: 380px; max-height: 80vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid var(--pink-soft); }
    .modal-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal h3 { font-size: 1.05rem; color: #333; }
    .small-edit-btn { background: #f0f0f0; border: none; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; color: #555; cursor: pointer; }
    .terms-textarea { width: 100%; height: 160px; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.85rem; line-height: 1.5; resize: vertical; outline: none; margin-bottom: 12px; }
    .modal-options { display: flex; gap: 8px; margin-bottom: 12px; }
    .modal-options button { flex: 1; padding: 9px; border: 1px solid var(--border-color); border-radius: 12px; background: white; color: #666; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .modal-options button.selected { border-color: var(--pink-main); background: var(--pink-soft); color: var(--pink-dark); }
    .modal textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; resize: none; margin-bottom: 14px; font-size: 0.85rem; outline: none; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .modal-btns .cancel { background: #f0f0f0; color: #666; border: none; }
    .modal-btns .save { background: var(--pink-main); color: white; border: none; }
    .modal-btns .delete-btn { background: #ff6b81; color: white; border: none; }
    
    .request-card { background: var(--pink-soft); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
    .request-card.bad { background: var(--bad-soft); border-color: var(--bad-border); }
    
    .archive-card { background: var(--pink-soft); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
    .archive-card.bad { background: var(--bad-soft); border-color: var(--bad-border); }
    .archive-card-header { font-weight: 700; color: #4a4a4a; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; cursor: pointer; }
    .archive-body { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ffd1dc; display: none; }
    .archive-card.bad .archive-body { border-top-color: var(--bad-border); }
    .archive-body.open { display: block; }
  </style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 id="authTitle">🍇 문희사항 로그인 🍇</h2>
    <p id="authDesc">두 분만의 소중한 공간에 오신 걸 환영해요!</p>
    <input type="email" id="authEmail" class="auth-input" placeholder="이메일 주소 입력">
    <input type="password" id="authPassword" class="auth-input" placeholder="비밀번호 (6자리 이상)">
    <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">로그인하기</button>
    <span class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">계정이 없으신가요? 회원가입하기</span>
  </div>
</div>

<div class="container">
  <header>
    <h1>🍇 문희사항 🍇</h1>
    <div class="top-btns">
      <button class="top-btn" onclick="openInboxModal()">📬 요청함 <span class="badge-dot" id="reqBadge" style="display:none;">0</span></button>
      <button class="top-btn" onclick="openTermsModal()">📋 이용 약관</button>
      <button class="top-btn" onclick="openArchiveModal()">📜 포도판 보관함</button>
    </div>
  </header>

  <div class="dual-board" id="dualBoardContainer"></div>
</div>

<!-- 이용약관 모달 -->
<div class="modal-overlay" id="termsModal">
  <div class="modal">
    <div class="modal-header-flex">
      <h3>📋 이용 약관</h3>
      <button class="small-edit-btn" id="termsEditBtn" onclick="toggleTermsEdit()">수정</button>
    </div>
    <div id="termsBody"></div>
    <div class="modal-btns" id="termsModalBtns">
      <button class="cancel" onclick="closeTermsModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 스티커 주기/요청 모달 (1개 고정) -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="modalTitle">스티커</h3>
    <textarea id="stickerReason" placeholder="사유를 적어주세요!"></textarea>
    <div class="modal-btns">
      <button class="cancel" onclick="closeAddModal()">취소</button>
      <button class="save" id="modalSubmitBtn" onclick="submitStickerModal()">확인</button>
    </div>
  </div>
</div>

<!-- 받은 요청함 모달 -->
<div class="modal-overlay" id="inboxModal">
  <div class="modal">
    <h3>📥 받은 스티커 요청함</h3>
    <div id="inboxList" style="margin: 12px 0; max-height: 250px; overflow-y: auto;"></div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeInboxModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 스티커 상세/수정/삭제 모달 (현재 진행 중인 판용) -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h3 id="detailTitle">🍇 스티커 정보</h3>
    <div id="detailContentBody" style="margin-bottom:15px; line-height: 1.5; color:#555; font-size: 0.88rem;"></div>
    <div class="modal-btns" id="detailModalBtns">
      <button class="cancel" onclick="closeDetailModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 보관함 모달 -->
<div class="modal-overlay" id="archiveModal">
  <div class="modal">
    <h3>📜 포도판 보관함</h3>
    <div class="modal-options" style="margin: 10px 0;">
      <button id="filter-user1" class="selected" onclick="setArchiveUser('user1')">사용자 1</button>
      <button id="filter-user2" onclick="setArchiveUser('user2')">사용자 2</button>
    </div>
    <div class="modal-options" style="margin-bottom: 12px;">
      <button id="filter-like" class="selected" onclick="setArchiveTab('like')">💖 좋아요</button>
      <button id="filter-bad" onclick="setArchiveTab('bad')">💔 나빠요</button>
    </div>
    <div id="archiveList" style="max-height: 260px; overflow-y: auto;"></div>
    <div class="modal-btns" style="margin-top: 12px;">
      <button class="cancel" onclick="closeArchiveModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 보관된 판 수정용 모달 (포도판 형태로 표시) -->
<div class="modal-overlay" id="archiveEditModal">
  <div class="modal" style="max-width: 400px;">
    <div class="modal-header-flex">
      <h3 id="archiveEditTitle">✏️ 완성된 포도판 수정</h3>
      <button class="cancel" style="padding:4px 10px; font-size:0.75rem;" onclick="closeArchiveEditModal()">닫기</button>
    </div>
    <div class="board-status" style="margin-bottom: 10px;">
      <span id="archiveEditVol">Vol. 1</span>
      <span id="archiveEditCount">15 / 15개</span>
    </div>
    <div class="grape-container" id="archiveEditGrapeContainer" style="margin-bottom: 14px;"></div>
    <div class="modal-btns">
      <button class="save" onclick="closeArchiveEditModal()">확인 완료</button>
    </div>
  </div>
</div>

<!-- 보관된 판 내부 개별 스티커 수정/삭제 모달 -->
<div class="modal-overlay" id="archiveItemModal">
  <div class="modal">
    <h3 id="archiveItemModalTitle">✏️ 보관된 스티커 수정</h3>
    <div style="margin-bottom: 10px; font-size: 0.80rem; color: #888;" id="archiveItemDate">날짜: </div>
    <div id="archiveItemContentBody"></div>
    <div style="display:none;" id="archiveItemValText">1개</div>
    <div class="modal-btns" id="archiveItemModalBtns">
      <button class="cancel" onclick="closeArchiveItemModal()">닫기</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://skxaatryqofhfluakczz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_5q751-dGVaSXEW6YEJqZ2w_wOGghSQU';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserId = null;
  let isSignUpMode = false;
  let foldedState = { user1: false, user2: false };

  const smileSvg = `<svg viewBox="0 0 100 100"><ellipse cx="36" cy="38" rx="5.5" ry="11" fill="#333" /><ellipse cx="64" cy="38" rx="5.5" ry="11" fill="#333" /><path d="M 28 58 Q 50 82 72 58" fill="none" stroke="#333" stroke-width="6.5" stroke-linecap="round" /></svg>`;
  const sadSvg = `<svg viewBox="0 0 100 100"><ellipse cx="36" cy="38" rx="5.5" ry="11" fill="#333" /><ellipse cx="64" cy="38" rx="5.5" ry="11" fill="#333" /><path d="M 28 72 Q 50 52 72 72" fill="none" stroke="#333" stroke-width="6.5" stroke-linecap="round" /></svg>`;

  const defaultTerms = [
    "하루에 스티커는 최대 3개까지만 줄 수 있어요.",
    "한 가지 일에는 최대 1개 스티커만 줄 수 있어요.",
    "바라는 것의 금전적인 한도는 최대 3만 원이에요.",
    "좋아요 완성 판 5개 모으면 한 달간 당신이 왕이에요!",
    "안 준 스티커는 내일로 이월되지 않아요.",
    "사유를 잘못 적었을 땐 상대방 화면에서 언제든 수정/삭제가 가능해요."
  ];

  let appState = {
    terms: [...defaultTerms],
    users: { 
      user1: { name: '사용자 1', activeTab: 'like', ownerEmail: '' }, 
      user2: { name: '사용자 2', activeTab: 'like', ownerEmail: '' } 
    },
    boards: {
      user1: { like: { currentVol: 1, stickers: [], memo: '' }, bad: { currentVol: 1, stickers: [], memo: '' }, archive: [] },
      user2: { like: { currentVol: 1, stickers: [], memo: '' }, bad: { currentVol: 1, stickers: [], memo: '' }, archive: [] }
    },
    requests: []
  };

  let selectedTargetUser = null;
  let currentActiveStickerIndex = -1, currentActiveTargetUser = null, currentActiveTab = null;
  let editingArchiveTarget = null;
  let currentEditingArchiveStickerIndex = -1;
  let isRequestMode = false;

  let currentArchiveUser = 'user1';
  let currentArchiveTab = 'like';

  window.onload = async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      document.getElementById('authOverlay').style.display = 'none';
      await loadCloudData();
    }
  };

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').innerText = isSignUpMode ? '🍇 문희사항 회원가입 🍇' : '🍇 문희사항 로그인 🍇';
    document.getElementById('authSubmitBtn').innerText = isSignUpMode ? '가입하고 시작하기' : '로그인하기';
    document.getElementById('authSwitchText').innerText = isSignUpMode ? '이미 계정이 있으신가요? 로그인하기' : '계정이 없으신가요? 회원가입하기';
  }

  async function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    if (!email || !password) { alert('이메일과 비밀번호를 입력해주세요!'); return; }

    if (isSignUpMode) {
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) { alert('가입 실패: ' + error.message); return; }
      alert('회원가입 완료! 로그인되었습니다.');
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { alert('로그인 실패: ' + error.message); return; }
    }

    document.getElementById('authOverlay').style.display = 'none';
    await loadCloudData();
  }

  async function fetchLatestCloudData() {
    const currentTab1 = appState.users?.user1?.activeTab || 'like';
    const currentTab2 = appState.users?.user2?.activeTab || 'like';

    const { data } = await supabaseClient.from('boards_data').select('*');
    if (data && data.length > 0) {
      const savedState = data.find(row => row.id === 'main_state');
      if (savedState && savedState.data) {
        appState = { ...appState, ...savedState.data };
      }
    }
    if (!appState.requests) appState.requests = [];

    if (appState.users?.user1) appState.users.user1.activeTab = currentTab1;
    if (appState.users?.user2) appState.users.user2.activeTab = currentTab2;
  }

  async function loadCloudData() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    const email = user.email;

    await fetchLatestCloudData();
    
    ['user1', 'user2'].forEach(u => {
      if (!appState.boards[u]) appState.boards[u] = {};
      ['like', 'bad'].forEach(t => {
        if (!appState.boards[u][t]) appState.boards[u][t] = { currentVol: 1, stickers: [], memo: '' };
        if (typeof appState.boards[u][t].currentVol !== 'number') appState.boards[u][t].currentVol = 1;
        if (!Array.isArray(appState.boards[u][t].stickers)) appState.boards[u][t].stickers = [];
      });
      if (!Array.isArray(appState.boards[u].archive)) appState.boards[u].archive = [];
    });

    if (appState.users.user1.ownerEmail === email) currentUserId = 'user1';
    else if (appState.users.user2.ownerEmail === email) currentUserId = 'user2';
    else {
      if (!appState.users.user1.ownerEmail) { appState.users.user1.ownerEmail = email; currentUserId = 'user1'; }
      else if (!appState.users.user2.ownerEmail) { appState.users.user2.ownerEmail = email; currentUserId = 'user2'; }
      else { currentUserId = 'user1'; }
      await saveCloudData();
    }

    appState.users.user1.activeTab = 'like';
    appState.users.user2.activeTab = 'like';

    renderAll();
  }

  async function saveCloudData() {
    await supabaseClient.from('boards_data').upsert({
      id: 'main_state',
      data: appState,
      updated_at: new Date()
    });
  }

  function renderAll() {

  function renderBoardContent(userId) {
    const tab = appState.users[userId].activeTab;
    const board = appState.boards[userId][tab];
    const container = document.getElementById(`grape-${userId}`);
    const toggle = document.getElementById(`toggle-${userId}`);
    const memoSection = document.getElementById(`memoSection-${userId}`);
    const nameSpan = document.getElementById(`name-${userId}`);
    
    if (nameSpan && appState.users[userId]) {
      nameSpan.innerText = appState.users[userId].name;
    }

    if (tab === 'bad') {
      container.classList.add('bad-mode'); toggle.classList.add('bad-mode'); memoSection.classList.add('bad-mode');
    } else {
      container.classList.remove('bad-mode'); toggle.classList.remove('bad-mode'); memoSection.classList.remove('bad-mode');
    }

    const card = document.getElementById(`card-${userId}`);
    const btns = card.querySelectorAll('.board-toggle button');
    btns[0].className = tab === 'like' ? 'active like' : '';
    btns[1].className = tab === 'bad' ? 'active bad' : '';

    let totalCount = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
    document.getElementById(`vol-${userId}`).innerText = `${tab === 'like' ? '좋아요' : '나빠요'} Vol. ${board.currentVol}`;
    document.getElementById(`count-${userId}`).innerText = `${totalCount} / 15개`;
    
    container.innerHTML = '';
    const layout = [5, 4, 3, 2, 1];
    let stickerIdx = 0;
    
    layout.forEach(rowCount => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'grape-row';
      for (let i = 0; i < rowCount; i++) {
        const grapeIndex = stickerIdx;
        const grape = document.createElement('div');
        grape.className = 'grape-grape';
        
        let accumulated = 0, foundStickerIdx = -1;
        for (let idx = 0; idx < board.stickers.length; idx++) {
          let item = board.stickers[idx];
          accumulated += item.value;
          if (accumulated - item.value < grapeIndex + 1 && accumulated > grapeIndex) {
            foundStickerIdx = idx;
            break;
          }
        }

        if (foundStickerIdx !== -1) {
          grape.classList.add('full', tab);
          grape.innerHTML = tab === 'like' ? smileSvg : sadSvg;
          grape.onclick = () => showStickerDetail(userId, foundStickerIdx, tab);
        } else {
          grape.innerText = grapeIndex + 1;
          grape.onclick = null;
        }
        rowDiv.appendChild(grape);
        stickerIdx++;
      }
      container.appendChild(rowDiv);
    });

    renderMemo(userId, tab, memoSection);
  }

  function renderMemo(userId, tab, memoSection) {
    const board = appState.boards[userId][tab];
    const isMyCard = (userId === currentUserId);
    const canEdit = (tab === 'like' && isMyCard) || (tab === 'bad' && !isMyCard);

        actionBtns.innerHTML = `<div class="memo-btns" style="margin-left: 8px;"><button class="memo-edit-btn" onclick="editMemo('${userId}', '${tab}')">수정</button><button class="memo-del-btn" onclick="deleteMemo('${userId}', '${tab}')">삭제</button></div>`;

      } else {
        displaySpan.innerHTML = `<span style="color:#aaa; font-weight:normal;">등록된 내용이 없습니다.</span>`;

    }

  async function submitStickerModal() {
    const reason = document.getElementById('stickerReason').value.trim();
    if (!reason) { alert('사유를 입력해주세요!'); return; }

    await fetchLatestCloudData();

    const today = new Date().toISOString().split('T')[0];

    if (isRequestMode) {
      if (!appState.requests) appState.requests = [];
      appState.requests.push({
        id: Date.now(),
        from: currentUserId,
        to: selectedTargetUser,
        type: 'like',
        value: 1,
        reason: reason,
        date: today,
        isRequest: true
      });

      await saveCloudData();
      renderAll();
      alert('상대방에게 좋아요 스티커 요청을 보냈습니다! 상대방이 승낙하면 내 판에 채워져요.');
      closeAddModal();
      return;
    }

    const targetUserObj = appState.users[selectedTargetUser];
    const tab = targetUserObj.activeTab;
    
    if (!appState.boards[selectedTargetUser]) appState.boards[selectedTargetUser] = {};
    if (!appState.boards[selectedTargetUser][tab]) {
      appState.boards[selectedTargetUser][tab] = { currentVol: 1, stickers: [], memo: '' };
    }
    const board = appState.boards[selectedTargetUser][tab];

    let currentTotal = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
    let maxAllowed = 15 - currentTotal;

    if (tab === 'like') {
      let firstPart = maxAllowed >= 1 ? 1 : maxAllowed;
      let secondPart = 1 - firstPart;

      if (firstPart > 0) {
        board.stickers.push({ value: firstPart, reason: reason, date: today, from: currentUserId, isRequest: false });
      }

      let newTotal = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
      if (newTotal >= 15) {
        if (!Array.isArray(appState.boards[selectedTargetUser].archive)) {
          appState.boards[selectedTargetUser].archive = [];
        }

        appState.boards[selectedTargetUser].archive.push({
          vol: board.currentVol,
          type: tab,
          stickers: [...board.stickers],
          memo: board.memo,
          completedDate: today
        });

        board.currentVol += 1;
        board.stickers = [];
        board.memo = '';

        if (secondPart > 0) {
          board.stickers.push({ value: secondPart, reason: `${reason} (이월)`, date: today, from: currentUserId, isRequest: false });
        }
        alert('🎉 포도판이 완성되어 보관함에 저장되고, 새로운 판(Vol. ' + board.currentVol + ')이 생성되었습니다!');
      } else {
        alert('좋아요 스티커가 정상적으로 부여되었습니다!');
      }

      await saveCloudData();
      renderAll();
    } else {
      if (!appState.requests) appState.requests = [];
      appState.requests.push({
        id: Date.now(),
        from: currentUserId,
        to: selectedTargetUser,
        type: 'bad',
        value: 1,
        reason: reason,
        date: today
      });

      await saveCloudData();
      renderAll();
      alert('상대방에게 나빠요 스티커 요청을 보냈습니다! 상대방이 승낙해야 반영돼요.');
    }

    closeAddModal();
  }

  async function deleteSticker() {
    if (!confirm('정말 이 스티커를 삭제하시겠습니까?')) return;

  async function acceptRequest(reqId) {
    await fetchLatestCloudData();

    const req = (appState.requests || []).find(r => r && r.id === reqId);
    if (!req) { alert('이미 처리되었거나 존재하지 않는 요청입니다.'); closeInboxModal(); renderAll(); return; }

    appState.requests = appState.requests.filter(r => r && r.id !== reqId);

    const targetBoardUser = req.isRequest ? req.from : currentUserId;
    const reqType = req.isRequest ? 'like' : req.type;

    if (!appState.boards[targetBoardUser]) appState.boards[targetBoardUser] = {};
    if (!appState.boards[targetBoardUser][reqType]) {
      appState.boards[targetBoardUser][reqType] = { currentVol: 1, stickers: [], memo: '' };
    }
    const board = appState.boards[targetBoardUser][reqType];

    let currentTotal = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
    let maxAllowed = 15 - currentTotal;

    let firstPart = maxAllowed >= req.value ? req.value : maxAllowed;
    let secondPart = req.value - firstPart;

    if (firstPart > 0) {
      board.stickers.push({ 
        value: firstPart, 
        reason: req.reason, 
        date: req.date, 
        from: req.isRequest ? currentUserId : req.from,
        isRequest: true 
      });
    }

    let newTotal = board.stickers.reduce((acc, cur) => acc + cur.value, 0);
    if (newTotal >= 15) {
      if (!Array.isArray(appState.boards[targetBoardUser].archive)) {
        appState.boards[targetBoardUser].archive = [];
      }

      appState.boards[targetBoardUser].archive.push({
        vol: board.currentVol,
        type: reqType,
        stickers: [...board.stickers],
        memo: board.memo,
        completedDate: req.date
      });

      board.currentVol += 1;
      board.stickers = [];
      board.memo = '';

      if (secondPart > 0) {
        board.stickers.push({ 
          value: secondPart, 
          reason: `${req.reason} (이월)`, 
          date: req.date, 
          from: req.isRequest ? currentUserId : req.from,
          isRequest: true 
        });
      }
      alert('🎉 포도판 완성! 보관함에 이관되고 새 판이 생성되었습니다.');
    }

    await saveCloudData();
    renderAll();
    openInboxModal();
  }

  }

    document.getElementById('filter-user1').className = currentArchiveUser === currentUserId ? 'selected' : '';
    document.getElementById('filter-user2').className = currentArchiveUser === otherUserId ? 'selected' : '';

    document.getElementById('filter-like').className = currentArchiveTab === 'like' ? 'selected' : '';
    document.getElementById('filter-bad').className = currentArchiveTab === 'bad' ? 'selected' : '';
  }

  function filterArchive() {
    const listDiv = document.getElementById('archiveList');
    if (!appState.boards[currentArchiveUser]) appState.boards[currentArchiveUser] = {};
    if (!appState.boards[currentArchiveUser].archive) appState.boards[currentArchiveUser].archive = [];
    
    const archive = appState.boards[currentArchiveUser].archive.filter(item => item.type === currentArchiveTab);

    if (archive.length === 0) {
      listDiv.innerHTML = `<p style="text-align:center; padding:20px; color:#aaa; font-size:0.8rem;">조건에 맞는 완성된 포도판이 없습니다.</p>`; 
      return; 
    }

    listDiv.innerHTML = '';
    archive.forEach((item, index) => {
      const realIndex = appState.boards[currentArchiveUser].archive.indexOf(item);
      const isBad = (item.type === 'bad');

      const card = document.createElement('div');
      card.className = `archive-card ${isBad ? 'bad' : ''}`;
      card.innerHTML = `
        <div class="archive-card-header">
          <span onclick="toggleArchiveBody('${currentArchiveUser}', ${realIndex})" style="flex:1;">${isBad ? '나빠요' : '좋아요'} Vol. ${item.vol} (완성: ${item.completedDate})</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="small-edit-btn" onclick="openArchiveEdit('${currentArchiveUser}', ${realIndex})" title="포도판 형태 보기">✏️</button>
            <span onclick="toggleArchiveBody('${currentArchiveUser}', ${realIndex})" style="font-size:0.85rem; color:${isBad ? '#5b7bb2' : '#ff8da1'}; font-weight:600; cursor:pointer;" id="archive-toggle-text-${currentArchiveUser}-${realIndex}">▼</span>
          </div>
        </div>
        <div class="archive-body" id="archive-body-${currentArchiveUser}-${realIndex}">
          <ul style="padding-left:16px; margin-top:4px;">` + 
          item.stickers.map(s => {
            const reqLabel = s.isRequest ? ' <span style="color:#ff6b81; font-weight:600;">[요청]</span>' : '';
            return `<li style="font-size:0.78rem; color:#666; margin-bottom:3px;">[${s.date}] ${s.reason}${reqLabel}</li>`;
          }).join('') + `</ul>
        </div>
      `;
      listDiv.appendChild(card);
    });
  }

  function toggleArchiveBody(userId, index) {
    const body = document.getElementById(`archive-body-${userId}-${index}`);
    const toggleText = document.getElementById(`archive-toggle-text-${userId}-${index}`);
    if (body.classList.contains('open')) {
      body.classList.remove('open');
      toggleText.innerText = '▼';
    } else {
      body.classList.add('open');
      toggleText.innerText = '▲';
    }
  }

  async function openArchiveEdit(userId, index) {
    await fetchLatestCloudData();
    editingArchiveTarget = { userId, index };
    const item = appState.boards[userId].archive[index];

    document.getElementById('archiveEditTitle').innerText = `✏️ ${item.type === 'like' ? '좋아요' : '나빠요'} Vol. ${item.vol} 판`;
    document.getElementById('archiveEditVol').innerText = `${item.type === 'like' ? '좋아요' : '나빠요'} Vol. ${item.vol}`;
    document.getElementById('archiveEditCount').innerText = `${item.stickers.reduce((a,c)=>a+c.value,0)} / 15개`;

    const container = document.getElementById('archiveEditGrapeContainer');
    container.className = `grape-container ${item.type === 'bad' ? 'bad-mode' : ''}`;
    container.innerHTML = '';

    const layout = [5, 4, 3, 2, 1];
    let stickerIdx = 0;

    layout.forEach(rowCount => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'grape-row';
      for (let i = 0; i < rowCount; i++) {
        const grapeIndex = stickerIdx;
        const grape = document.createElement('div');
        grape.className = 'grape-grape';

        let accumulated = 0, foundStIdx = -1;
        for (let idx = 0; idx < item.stickers.length; idx++) {
          let st = item.stickers[idx];
          accumulated += st.value;
          if (accumulated - st.value < grapeIndex + 1 && accumulated > grapeIndex) {
            foundStIdx = idx;
            break;
          }
        }

        if (foundStIdx !== -1) {
          grape.classList.add('full', item.type);
          grape.innerHTML = item.type === 'like' ? smileSvg : sadSvg;
          grape.onclick = () => openArchiveItemModal(foundStIdx, index);
        } else {
          grape.innerText = grapeIndex + 1;
        }
        rowDiv.appendChild(grape);
        stickerIdx++;
      }
      container.appendChild(rowDiv);
    });

    document.getElementById('archiveEditModal').classList.add('active');
  }

  function closeArchiveEditModal() {
    document.getElementById('archiveEditModal').classList.remove('active');
    openArchiveModal();
  }

  function openArchiveItemModal(stickerIdx, archiveIndex) {
    const { userId, index } = editingArchiveTarget;
    const archive = appState.boards[userId].archive;
    const item = archive[index].stickers[stickerIdx];
    if (!item) return;

    currentEditingArchiveStickerIndex = stickerIdx;

    document.getElementById('archiveItemDate').innerText = `날짜: ${item.date}${item.isRequest ? ' [요청]' : ''}`;
    
    const isAuthor = (item.from === currentUserId);
    const contentBody = document.getElementById('archiveItemContentBody');
    const btnsDiv = document.getElementById('archiveItemModalBtns');

    if (isAuthor) {
      contentBody.innerHTML = `
        <b>📝 사유 수정:</b><br>
        <textarea id="archiveItemReasonInput" style="width:100%; height:75px; padding:10px; border:1px solid var(--border-color); border-radius:12px; resize:none; margin-top:6px; font-size:0.85rem; outline:none;">${item.reason}</textarea>
      `;
      btnsDiv.innerHTML = `
        <button class="delete-btn" onclick="deleteArchiveItem()">삭제</button>
        <button class="cancel" onclick="closeArchiveItemModal()">취소</button>
        <button class="save" onclick="saveArchiveItemEdit()">저장</button>
      `;
    } else {
      contentBody.innerHTML = `<b>📝 사유:</b><br>${item.reason}`;
      btnsDiv.innerHTML = `<button class="cancel" onclick="closeArchiveItemModal()">닫기</button>`;
    }

    document.getElementById('archiveItemModal').classList.add('active');
  }

  function closeArchiveItemModal() {
    document.getElementById('archiveItemModal').classList.remove('active');
  }

  async function saveArchiveItemEdit() {
    const newReason = document.getElementById('archiveItemReasonInput').value.trim();
    if (!newReason) { alert('사유를 입력해주세요!'); return; }

    await fetchLatestCloudData();
    const { userId, index } = editingArchiveTarget;
    const targetSticker = appState.boards[userId].archive[index].stickers[currentEditingArchiveStickerIndex];
    if (targetSticker) {
      targetSticker.reason = newReason;
      await saveCloudData();
    }

    closeArchiveItemModal();
    openArchiveEdit(editingArchiveTarget.userId, editingArchiveTarget.index);
    alert('수정되었습니다!');
  }

  async function deleteArchiveItem() {
    if (!confirm('이 스티커를 삭제하시겠습니까?')) return;

    await fetchLatestCloudData();
    const { userId, index } = editingArchiveTarget;
    const archive = appState.boards[userId].archive;
    const archivedBoard = archive[index];

    archivedBoard.stickers.splice(currentEditingArchiveStickerIndex, 1);

    const activeTab = archivedBoard.type;
    const activeBoard = appState.boards[userId][activeTab];

    let archivedSum = archivedBoard.stickers.reduce((acc, cur) => acc + cur.value, 0);
    let activeSum = activeBoard.stickers.reduce((acc, cur) => acc + cur.value, 0);
    let totalAvailable = archivedSum + activeSum;

    if (totalAvailable >= 15) {
      if (activeBoard.stickers.length > 0) {
        archivedBoard.stickers.push(activeBoard.stickers.shift());
      }
      alert('완성된 판의 빈자리가 현재 진행 중인 판의 첫 번째 스티커로 채워졌습니다!');
    } else {
      archive.splice(index, 1);
      activeBoard.stickers = [...archivedBoard.stickers, ...activeBoard.stickers];
      activeBoard.currentVol = archivedBoard.vol;
      alert('스티커가 삭제되어 전체 개수가 15개 미만이 되므로, 해당 판이 현재 진행 중인 판으로 되돌아왔습니다!');
    }

    await saveCloudData();
    closeArchiveItemModal();
    closeArchiveEditModal();
    closeArchiveModal();
    openArchiveModal();
    renderAll();
  }
</script>
</body>
</html>
